services:
  # WOODPLAN AI - FastAPI Backend Service on Render
  - type: web
    name: woodplan-ai-backend
    env: python
    region: oregon
    plan: standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: woodplan-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://woodplan-ai.vercel.app
      - key: AI_PROVIDER
        value: gemini
      - key: VISION_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false # Set in Render Dashboard

databases:
  # PostgreSQL Database Instance
  - name: woodplan-postgres
    databaseName: woodplan
    user: woodplan_user
    plan: basic-256mb
    region: oregon
